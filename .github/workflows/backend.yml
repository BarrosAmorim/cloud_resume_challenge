name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "template.yaml"
      - ".github/workflows/backend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "template.yaml"
      - ".github/workflows/backend.yml"

jobs:
  # ==========================================
  # JOB 1 - TESTES
  # ==========================================
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Executar testes
        working-directory: backend
        run: pytest test_lambda_function.py -v

  # ==========================================
  # JOB 2 - BUILD E DEPLOY
  # ==========================================
  deploy:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configurar AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build

      # ==========================================
      # DEBUG OIDC
      # ==========================================
      - name: Debug OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('OIDC repository:', payload.repository);
            console.log('OIDC ref:', payload.ref);

      # ==========================================
      # AWS OIDC
      # ==========================================
      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::696537703431:role/github-actions-backend-role
          aws-region: us-east-1

      - name: Testar acesso AWS
        run: aws sts get-caller-identity

      # ==========================================
      # SAM DEPLOY
      # ==========================================
      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name cloud-resume-challenge \
            --region us-east-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset